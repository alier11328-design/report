<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>万能班长 · 结课报告（多门）生成器</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="ai-client.js"></script>
    <style>
        :root {
            --primary-color: #BF2A32;
            --primary-rgb: 191, 42, 50;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
        }
        body {
            background: #f5f7fb;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .app {
            width: 100%;
            max-width: 1500px;
            background: white;
            border-radius: 32px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.05);
            overflow: hidden;
            min-height: 700px;
            height: 90vh;
            display: flex;
            flex-direction: column;
        }
        .split-layout {
            display: grid;
            grid-template-columns: 480px 1fr;
            flex: 1;
            min-height: 0;
        }
        .editor-pane {
            background: #fafbfc;
            border-right: 1px solid #eef2f6;
            padding: 28px 24px;
            overflow-y: auto;
            height: 100%;
        }
        .preview-pane {
            background: #f2f4f8;
            padding: 24px;
            overflow-y: auto;
            height: 100%;
            display: flex;
            flex-direction: column;
        }
        .preview-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
        }
        .preview-header .actions { display: flex; gap: 10px; }
        .form-section-title {
            font-weight: 700;
            font-size: 18px;
            margin: 24px 0 16px;
            color: #1e293b;
            border-left: 5px solid var(--primary-color);
            padding-left: 14px;
        }
        .form-group {
            margin-bottom: 0;
            flex: 1;
        }
        .form-group label {
            display: block;
            font-weight: 600;
            font-size: 13px;
            color: #475569;
            margin-bottom: 6px;
        }
        .form-group input, .form-group textarea, .form-group select {
            width: 100%;
            padding: 12px 14px;
            border: 1.5px solid #e2e8f0;
            border-radius: 12px;
            font-size: 14px;
            background: white;
            transition: 0.2s;
        }
        .form-group input:focus, .form-group textarea:focus, .form-group select:focus {
            border-color: var(--primary-color);
            outline: none;
            box-shadow: 0 0 0 3px rgba(var(--primary-rgb), 0.08);
        }
        .form-group select { cursor: pointer; }
        label input[type="checkbox"] {
            width: auto;
            accent-color: var(--primary-color);
            cursor: pointer;
            margin: 0;
            vertical-align: middle;
        }
        .btn {
            background: white;
            border: 1px solid #cbd5e1;
            padding: 10px 18px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .btn-primary {
            background: var(--primary-color);
            border-color: var(--primary-color);
            color: white;
        }
        .btn-primary:hover { filter: brightness(0.85); }
        .btn-block { width: 100%; justify-content: center; }
        .btn-sm { padding: 6px 12px; font-size: 12px; }
        .back-btn {
            background: transparent;
            border: none;
            color: #475569;
            font-weight: 600;
            margin-bottom: 16px;
            cursor: pointer;
            font-size: 14px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
        }
        .paste-area {
            border: 2px dashed var(--primary-color);
            border-radius: 20px;
            padding: 16px;
            text-align: center;
            background: rgba(var(--primary-rgb), 0.04);
            margin-bottom: 12px;
            cursor: pointer;
            transition: 0.2s;
        }
        .paste-area:hover { background: rgba(var(--primary-rgb), 0.08); }
        .paste-area i { font-size: 28px; color: var(--primary-color); margin-bottom: 6px; }
        .file-list {
            margin-top: 12px;
            text-align: left;
            max-height: 100px;
            overflow-y: auto;
            font-size: 13px;
        }
        .file-item {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 4px 8px;
            background: white;
            border-radius: 20px;
            margin-bottom: 4px;
        }
        .file-item i { font-size: 14px; margin: 0; color: var(--primary-color); }
        .file-item span {
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            cursor: pointer;
            color: #1e293b;
        }
        .file-item span:hover { text-decoration: underline; color: var(--primary-color); }
        .status-tip {
            font-size: 13px;
            color: var(--primary-color);
            margin: 5px 0;
        }
        .row { display: flex; gap: 12px; margin-bottom: 18px; }

        /* 课程编辑卡片 */
        .course-editor-card {
            border: 1px solid #e2e8f0;
            border-radius: 14px;
            padding: 14px;
            margin-bottom: 14px;
            background: white;
        }
        .course-editor-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }
        .course-editor-head strong {
            font-size: 14px;
            color: #1e293b;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .course-editor-head strong i { color: var(--primary-color); }
        .course-remove-btn {
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #dc2626;
            border-radius: 20px;
            padding: 4px 12px;
            font-size: 12px;
            cursor: pointer;
            font-weight: 600;
        }
        .course-remove-btn:hover { background: #fee2e2; }
        .subitem-card {
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 10px 12px 12px;
            margin-bottom: 8px;
            background: white;
        }
        .subitem-card-head {
            display: flex;
            gap: 8px;
            align-items: center;
            margin-bottom: 6px;
        }
        .subitem-card-head .sub-title {
            flex: 1;
            min-width: 0;
            padding: 8px 12px;
            font-weight: 600;
        }
        .subitem-card .sub-content {
            width: 100%;
            padding: 9px 12px;
            border: 1.5px solid #e2e8f0;
            border-radius: 10px;
            font-size: 13px;
            line-height: 1.6;
            background: #fafbfc;
            resize: vertical;
            min-height: 56px;
        }
        .subitem-card .sub-content:focus {
            border-color: var(--primary-color);
            outline: none;
            box-shadow: 0 0 0 3px rgba(var(--primary-rgb), 0.08);
            background: white;
        }
        .subitem-remove {
            flex-shrink: 0;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: 1px solid #e2e8f0;
            background: #f8fafc;
            color: #64748b;
            cursor: pointer;
            font-size: 12px;
        }
        .subitem-remove:hover { background: #fee2e2; border-color: #fecaca; color: #dc2626; }
        .add-subitem-btn {
            background: #f1f5f9;
            border: 1px dashed #cbd5e1;
            color: #475569;
            border-radius: 20px;
            padding: 6px 14px;
            font-size: 12px;
            cursor: pointer;
            font-weight: 600;
            margin-top: 2px;
        }
        .add-subitem-btn:hover { background: #e2e8f0; }
        .course-ai-block {
            border: 1px dashed #cbd5e1;
            border-radius: 12px;
            padding: 10px 12px;
            margin-bottom: 12px;
            background: #f8fafc;
        }
        .course-ai-block .paste-area { padding: 10px; margin-bottom: 0; border-radius: 14px; }
        .course-ai-block .paste-area i { font-size: 20px; margin-bottom: 2px; }
        .course-ai-block .paste-area p { font-size: 12px; }
        .course-ai-actions { display: flex; gap: 8px; margin-top: 8px; align-items: center; flex-wrap: wrap; }

        /* ==========================================================
           预览区：与《万能班长包课辅导结课报告》参考稿 1:1 复刻
           ========================================================== */
        .report-card {
            max-width: 1000px;
            margin: 0 auto;
            background: #fff;
            border-radius: 16px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 12px 40px rgba(80, 20, 25, 0.12);
        }
        .report-card * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
        }
        /* 顶部渐变装饰条 */
        .report-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 6px;
            background: linear-gradient(90deg, #8E1D25, #BF2A32, #E85D6B, #BF2A32, #8E1D25);
            z-index: 20;
        }
        /* 头部 */
        .report-card .header {
            position: relative;
            overflow: hidden;
            padding: 46px 40px 44px;
            text-align: center;
            color: #fff;
            background: linear-gradient(135deg, #8E1D25 0%, #BF2A32 48%, #D9444E 100%);
        }
        .report-card .header::before,
        .report-card .header::after {
            content: '';
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.08);
        }
        .report-card .header::before {
            width: 260px;
            height: 260px;
            top: -140px;
            left: -80px;
        }
        .report-card .header::after {
            width: 200px;
            height: 200px;
            bottom: -120px;
            right: -50px;
        }
        .report-card .header-logo {
            position: relative;
            z-index: 2;
            display: block;
            max-width: 58px;
            width: 100%;
            height: auto;
            margin: 0 auto 18px;
        }
        .report-card .header h1 {
            position: relative;
            z-index: 2;
            font-size: 42px;
            font-weight: 800;
            letter-spacing: 2px;
            line-height: 1.3;
        }
        /* 基本信息 */
        .report-card .basic-info {
            padding: 26px 40px;
            background: #fff;
            border-bottom: 1px solid #F3E5E7;
        }
        .report-card .info-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
        }
        .report-card .info-item {
            padding: 14px 18px;
            border-radius: 12px;
            background: linear-gradient(140deg, #FFF9F9 0%, #FDF0F2 100%);
            border: 1px solid #F7E6E8;
        }
        .report-card .info-label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 1px;
            color: #B5797E;
            margin-bottom: 6px;
        }
        .report-card .info-value {
            display: block;
            font-size: 16px;
            font-weight: 700;
            color: #362A2B;
        }
        /* 内容区 */
        .report-card .content {
            padding: 34px 40px 14px;
        }
        .report-card .section {
            margin-bottom: 42px;
        }
        .report-card .section-title {
            display: flex;
            align-items: center;
            font-size: 22px;
            font-weight: 700;
            color: #BF2A32;
            padding-bottom: 12px;
            margin-bottom: 20px;
            border-bottom: 2px solid #F6E8E9;
            position: relative;
        }
        .report-card .section-title::before {
            content: '';
            width: 5px;
            height: 22px;
            border-radius: 3px;
            margin-right: 12px;
            flex-shrink: 0;
            background: linear-gradient(180deg, #E85D6B, #BF2A32);
        }
        .report-card .section-title::after {
            content: '';
            position: absolute;
            left: 0;
            bottom: -2px;
            width: 90px;
            height: 2px;
            background: linear-gradient(90deg, #BF2A32, rgba(191, 42, 50, 0));
        }
        .report-card .section > p {
            font-size: 15px;
            line-height: 1.95;
            color: #4b4444;
        }
        /* 学习表现 */
        .report-card .performance-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
        }
        .report-card .performance-item {
            position: relative;
            overflow: hidden;
            text-align: center;
            padding: 26px 16px 22px;
            border-radius: 14px;
            background: linear-gradient(160deg, #FFF8F9 0%, #FCEBEE 100%);
            border: 1px solid #F7E2E5;
        }
        .report-card .performance-item::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #BF2A32, #E85D6B, #F3A6AD);
        }
        .report-card .performance-item h3 {
            font-size: 15px;
            font-weight: 600;
            letter-spacing: 0.5px;
            color: #8A6366;
        }
        .report-card .performance-value {
            font-size: 30px;
            font-weight: 800;
            letter-spacing: -1px;
            color: #BF2A32;
            margin: 10px 0 8px;
        }
        .report-card .performance-item p {
            font-size: 13px;
            line-height: 1.6;
            color: #93807F;
        }
        /* 课程区块 */
        .report-card .course-block {
            --c-a: #BF2A32;
            --c-b: #E4545F;
            --c-soft: #FDF1F2;
            --c-line: #F5E2E4;
            margin-top: 28px;
            background: #fff;
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid var(--c-line);
            box-shadow: 0 6px 22px rgba(120, 40, 45, 0.07);
        }
        .report-card .course-block:first-of-type {
            margin-top: 6px;
        }
        /* 每门课独立渐变主题 */
        .report-card .course-c1 {
            --c-a: #BF2A32;
            --c-b: #E4545F;
            --c-soft: #FDF1F2;
            --c-line: #F5E2E4;
        }
        .report-card .course-c2 {
            --c-a: #A32A55;
            --c-b: #D0588A;
            --c-soft: #FCF0F6;
            --c-line: #F4E0EA;
        }
        .report-card .course-c3 {
            --c-a: #8E2E68;
            --c-b: #BB5C9B;
            --c-soft: #FBF0F8;
            --c-line: #F2E0EE;
        }
        .report-card .course-c4 {
            --c-a: #A8441F;
            --c-b: #D9764C;
            --c-soft: #FDF3ED;
            --c-line: #F5E4DA;
        }
        /* 课程头部：左标题 + 右环形图 */
        .report-card .course-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 16px 24px;
            background: linear-gradient(120deg, var(--c-a) 0%, var(--c-b) 100%);
            color: #fff;
        }
        .report-card .course-head-left {
            display: flex;
            align-items: center;
            gap: 14px;
            min-width: 0;
            flex: 1;
        }
        .report-card .course-index {
            flex-shrink: 0;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 1px;
            background: rgba(255, 255, 255, 0.22);
            border: 1px solid rgba(255, 255, 255, 0.35);
        }
        .report-card .course-title {
            font-size: 19px;
            font-weight: 700;
            color: #fff;
            letter-spacing: 0.5px;
            word-break: break-word;
            line-height: 1.35;
        }
        /* 课时消耗环形图 */
        .report-card .hours-ring {
            flex-shrink: 0;
            position: relative;
            width: 68px;
            height: 68px;
            border-radius: 50%;
            border: 4px solid rgba(255, 255, 255, 0.92);
            background: rgba(0, 0, 0, 0.16);
            box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.14), 0 4px 12px rgba(0, 0, 0, 0.16);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            line-height: 1;
            text-align: center;
        }
        .report-card .hours-ring-value {
            font-size: 18px;
            font-weight: 800;
            color: #fff;
            letter-spacing: -0.5px;
        }
        .report-card .hours-ring-unit {
            font-size: 9px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.82);
            letter-spacing: 0.5px;
        }
        .report-card .course-body {
            padding: 24px;
            background: #fff;
        }
        /* 订单编号条 */
        .report-card .order-number {
            display: flex;
            align-items: baseline;
            flex-wrap: wrap;
            gap: 6px;
            padding: 13px 18px;
            margin-bottom: 22px;
            border-radius: 10px;
            background: var(--c-soft);
            border-left: 4px solid var(--c-a);
            font-size: 14px;
            color: #5d5151;
            word-break: break-all;
            line-height: 1.6;
        }
        .report-card .order-number .info-label {
            display: inline;
            margin: 0;
            font-size: 14px;
            font-weight: 700;
            color: var(--c-a);
            letter-spacing: 0;
            width: auto;
        }
        /* 小标题（学习目标回顾、学习成果概述、讲师寄语） */
        .report-card .block-label {
            display: flex;
            align-items: center;
            gap: 9px;
            font-size: 18px;
            font-weight: 700;
            color: var(--c-a);
            margin-top: 20px;
            margin-bottom: 10px;
        }
        .report-card .block-label::before {
            content: '';
            width: 4px;
            height: 16px;
            border-radius: 2px;
            background: linear-gradient(180deg, var(--c-b), var(--c-a));
        }
        /* 学习目标卡片 */
        .report-card .learning-goal {
            padding: 18px 20px;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--c-soft) 0%, #ffffff 100%);
            border: 1px solid var(--c-line);
            font-size: 15px;
            line-height: 1.9;
            color: #4d4343;
        }
        /* 成果 / 建议列表 */
        .report-card .outcome-list,
        .report-card .suggest-list {
            list-style: none;
            padding-left: 0;
            margin-top: 4px;
        }
        .report-card .outcome-list li,
        .report-card .suggest-list li {
            position: relative;
            padding-left: 22px;
            margin-bottom: 12px;
            font-size: 15px;
            line-height: 1.85;
            color: #4d4343;
        }
        .report-card .outcome-list li::before,
        .report-card .suggest-list li::before {
            content: '';
            position: absolute;
            left: 2px;
            top: 11px;
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--c-b, #E4545F), var(--c-a, #BF2A32));
        }
        .report-card .outcome-subtitle {
            color: var(--c-a, #BF2A32);
            font-weight: 700;
        }
        .report-card .outcome-list li:last-child,
        .report-card .suggest-list li:last-child {
            margin-bottom: 0;
        }
        /* 总成绩胶囊 */
        .report-card .total-score {
            display: inline-flex;
            align-items: center;
            gap: 14px;
            margin: 22px 0 4px;
            padding: 11px 24px 11px 18px;
            border-radius: 30px;
            background: linear-gradient(120deg, var(--c-a) 0%, var(--c-b) 100%);
            box-shadow: 0 6px 16px rgba(120, 40, 45, 0.22);
        }
        .report-card .score-label {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.88);
            padding-right: 14px;
            border-right: 1px solid rgba(255, 255, 255, 0.38);
        }
        .report-card .score-value {
            font-size: 19px;
            font-weight: 700;
            color: #fff;
            letter-spacing: 0.5px;
        }
        /* 讲师寄语 */
        .report-card .teacher-review {
            padding: 20px 24px;
            border-radius: 0 12px 12px 0;
            border-left: 4px solid var(--c-a);
            background: linear-gradient(135deg, var(--c-soft) 0%, #FFFCFC 100%);
            font-size: 15px;
            line-height: 1.95;
            color: #4d4343;
        }
        .report-card .teacher-review p {
            margin-bottom: 10px;
        }
        .report-card .teacher-review p:last-child {
            margin-bottom: 0;
        }
        /* 教辅寄语 */
        .report-card .assistant-review {
            padding: 22px 26px;
            border-radius: 0 12px 12px 0;
            border-left: 4px solid #E8A33D;
            background: linear-gradient(135deg, #FFF9EE 0%, #FFFDF8 100%);
            font-size: 15px;
            line-height: 2;
            color: #4d4343;
        }
        .report-card .assistant-review p {
            margin-bottom: 10px;
        }
        .report-card .assistant-review p:last-child {
            margin-bottom: 0;
        }
        /* 页脚 */
        .report-card .footer {
            padding: 24px 40px;
            text-align: center;
            font-size: 13px;
            color: #9a8486;
            background: linear-gradient(180deg, #FDF8F8 0%, #F7EEEF 100%);
            border-top: 1px solid #F2E4E5;
        }
        @media (max-width: 900px) {
            .split-layout { grid-template-columns: 1fr; height: auto; }
            .app { height: auto; }
        }
    </style>
</head>
<body>
<div class="app">
    <div class="split-layout">
        <!-- 左侧编辑区 -->
        <div class="editor-pane">

            <h3 style="font-size:22px; margin-bottom:20px;"><i class="fas fa-layer-group" style="color:var(--primary-color);"></i> 结课报告（多门）· 填写信息</h3>

            <div class="form-section-title">基本信息</div>
            <div class="row">

                <div class="form-group"><label>🏫 在读院校</label><input id="university" placeholder="布里斯托大学"></div>
            </div>
            <div class="row">
                <div class="form-group"><label>🗓️ 辅导周期开始</label><input id="periodStart" placeholder="2024.09"></div>
                <div class="form-group"><label>🏁 辅导周期结束</label><input id="periodEnd" placeholder="2025.01"></div>

                <div class="form-group">

                        <option value="custom">定制辅导</option>
                    </select>
                </div>
            </div>

            <div class="form-section-title">学习表现分析</div>
            <div class="row">
                <div class="form-group"><label>✅ 出勤率</label><input id="attendanceRate" placeholder="100%"></div>
                <div class="form-group"><label>📝 出勤说明</label><input id="attendanceDesc" placeholder="填写出勤率后自动生成，也可手动修改"></div>
            </div>
            <div class="row">
                <div class="form-group"><label>📝 任务完成率</label><input id="taskCompletionRate" placeholder="100%"></div>
                <div class="form-group"><label>📋 完成说明</label><input id="taskCompletionDesc" placeholder="填写任务完成率后自动生成，也可手动修改"></div>
            </div>

                <div class="form-group"><label>💬 互动说明</label><input id="interactionDesc" placeholder="填写课堂互动率后自动生成，也可手动修改"></div>
            </div>

            return String(text).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c] || c);
        }
        function nlToBr(text) { return escapeHtml(text).replace(/\n/g, '<br>'); }
        function paras(text) {
            return String(text || '').split('\n').map(s => s.trim()).filter(Boolean)
                .map(s => `<p>${escapeHtml(s)}</p>`).join('');
        }
        function formatFileSize(bytes) { if (bytes < 1024) return bytes + ' B'; if (bytes < 1024*1024) return (bytes/1024).toFixed(1) + ' KB'; return (bytes/(1024*1024)).toFixed(1) + ' MB'; }

        function val(id) { const el = document.getElementById(id); return el ? el.value : ''; }

        // ============ 表现说明自动生成（按填写的百分比分档出文案） ============
        function parseRate(str) {
            const m = String(str || '').replace(/％/g, '%').match(/\d+(\.\d+)?/);
            return m ? parseFloat(m[0]) : null;
        }
        function describeAttendance(rate) {
            if (rate === null) return '';
            if (rate >= 100) return '全勤参加所有辅导课程';
            if (rate >= 90) return '出勤表现优秀，仅极个别课程缺席';
            if (rate >= 80) return '出勤情况良好，偶有缺席但及时补齐课程';
            if (rate >= 60) return '出勤情况基本稳定，部分课程有缺席';
            return '出勤率偏低，需加强课程出勤与参与';
        }
        function describeTaskCompletion(rate) {
            if (rate === null) return '';
            if (rate >= 100) return '所有学习任务和作业按时完成';
            if (rate >= 90) return '绝大多数学习任务按时完成，质量稳定';
            if (rate >= 80) return '学习任务完成情况良好，个别任务有延误';
            if (rate >= 60) return '学习任务基本完成，部分任务有待跟进';
            return '任务完成情况有待提升，需加强时间管理';
        }
        function describeInteraction(rate) {
            if (rate === null) return '';
            if (rate >= 95) return '全程积极参与课堂讨论与互动';
            if (rate >= 90) return '积极参与课堂讨论与问题解决';
            if (rate >= 80) return '课堂参与度良好，能主动回应提问';
            if (rate >= 60) return '课堂互动尚可，偶有参与讨论';
            return '课堂互动较少，建议更主动参与课堂讨论';
        }
        function refreshPerformanceDesc() {
            document.getElementById('attendanceDesc').value = describeAttendance(parseRate(val('attendanceRate')));
            document.getElementById('taskCompletionDesc').value = describeTaskCompletion(parseRate(val('taskCompletionRate')));
            document.getElementById('interactionDesc').value = describeInteraction(parseRate(val('interactionRate')));
        }

        // 课程/建议编辑器事件委托
        function setupCourseEditorEvents() {
            const courseList = document.getElementById('courseList');
            courseList.addEventListener('input', (e) => {
                const t = e.target;
                const card = t.closest('[data-course]');
                if (!card) return;
                const ci = parseInt(card.dataset.course, 10);
                const course = courses[ci];
                if (!course) return;
                if (t.dataset.field === 'outcomeSubtitle' || t.dataset.field === 'outcomeContent') {
                    const row = t.closest('[data-outcome]');
                    const oi = parseInt(row.dataset.outcome, 10);
                    if (course.outcomes[oi]) course.outcomes[oi][t.dataset.field === 'outcomeSubtitle' ? 'subtitle' : 'content'] = t.value;
                } else if (t.type === 'checkbox' && t.dataset.field && t.dataset.field in course) {
                    course[t.dataset.field] = t.checked;
                } else if (t.dataset.field && t.dataset.field in course) {
                    course[t.dataset.field] = t.value;
                }
                renderPreview();
            });
            // 文件选择与勾选框
            courseList.addEventListener('change', (e) => {
                const t = e.target;
                const card = t.closest('[data-course]');
                const ci = card ? parseInt(card.dataset.course, 10) : lastActiveCourse;
                if (t.dataset.action === 'aiFileInput') {
                    if (t.files && t.files.length) addCourseFiles(ci, t.files); // 上传后自动识别
                    t.value = '';
                }
            });
            courseList.addEventListener('click', (e) => {
                // 记录当前活跃课程（供全局粘贴定位）
                const anyCard = e.target.closest('[data-course]');
                if (anyCard) lastActiveCourse = parseInt(anyCard.dataset.course, 10);
                const el = e.target.closest('[data-action]');
                if (!el) return;
                const action = el.dataset.action;
                const card = el.closest('[data-course]');
                const ci = card ? parseInt(card.dataset.course, 10) : lastActiveCourse;
                if (action === 'addOutcome') {
                    if (courses[ci]) courses[ci].outcomes.push(newOutcome());
                    renderCourseEditor();
                } else if (action === 'removeOutcome') {
                    const row = el.closest('[data-outcome]');
                    const oi = parseInt(row.dataset.outcome, 10);
                    if (courses[ci] && courses[ci].outcomes.length > 1) {
                        courses[ci].outcomes.splice(oi, 1);
                        renderCourseEditor();
                    }
                } else if (action === 'removeCourse') {
                    if (courses.length > 1) {
                        courses.splice(ci, 1);
                        lastActiveCourse = 0;
                        renderCourseEditor();
                    }
                } else if (action === 'aiPasteArea') {
                    const input = el.querySelector('input[type="file"]');
                    if (input) input.click();
                } else if (action === 'aiFill') {
                    recognizeCourseAI(ci);
                } else if (action === 'aiClear') {
                    if (courses[ci]) { courses[ci].aiFiles = []; courses[ci].aiStatus = ''; }
                    renderCourseEditor();
                } else if (action === 'aiRemoveFile') {
                    if (courses[ci]) courses[ci].aiFiles.splice(parseInt(el.dataset.idx, 10), 1);
                    renderCourseEditor();
                }
                renderPreview();
            });

            document.getElementById('addCourseBtn').addEventListener('click', () => {
                if (courses.length >= 8) { alert('最多支持 8 门课程'); return; }
                courses.push(newCourse());
                lastActiveCourse = courses.length - 1;
                renderCourseEditor();
                renderPreview();
            });

            const sugList = document.getElementById('suggestionList');
            sugList.addEventListener('input', (e) => {
                const t = e.target;
                const row = t.closest('[data-suggestion]');
                if (!row) return;
                const s = suggestions[parseInt(row.dataset.suggestion, 10)];
                if (!s) return;
                if (t.dataset.field === 'suggestionSubtitle') s.subtitle = t.value;
                if (t.dataset.field === 'suggestionContent') s.content = t.value;
                renderPreview();
            });
            sugList.addEventListener('click', (e) => {
                const btn = e.target.closest('button[data-action="removeSuggestion"]');
                if (!btn) return;
                const row = btn.closest('[data-suggestion]');
                if (suggestions.length > 1) {
                    suggestions.splice(parseInt(row.dataset.suggestion, 10), 1);
                    renderSuggestionEditor();
                    renderPreview();
                }
            });
            document.getElementById('addSuggestionBtn').addEventListener('click', () => {
                suggestions.push(newSuggestion());
                renderSuggestionEditor();
                renderPreview();
            });
        }

        function captureReport() {
            const el = document.getElementById('reportForExport');
            if (!el) return Promise.reject(new Error('预览未生成'));
            return html2canvas(el, {
                scale: 2,
                useCORS: true,
                logging: false,
                backgroundColor: '#ffffff'
            });
        }

        async function exportPng() {
            try {
                const canvas = await captureReport();
                const link = document.createElement('a');
                link.download = `${getReportTitle()}.png`;
                link.href = canvas.toDataURL('image/png');
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            } catch (e) {
                console.error('导出失败:', e);
                alert('导出失败，请重试');
            }
        }

        async function exportPdf() {
            try {
                const canvas = await captureReport();
                const { jsPDF } = window.jspdf;
                // 按固定宽度换算 PDF 尺寸，高度随内容自适应 → 整份报告一页显示
                const pdfWidth = 210; // mm，A4 宽度
                const pdfHeight = canvas.height * pdfWidth / canvas.width;
                const pdf = new jsPDF({
                    orientation: pdfHeight > pdfWidth ? 'portrait' : 'landscape',
                    unit: 'mm',
                    format: [pdfWidth, pdfHeight]
                });
                const imgData = canvas.toDataURL('image/jpeg', 0.95);
                pdf.addImage(imgData, 'JPEG', 0, 0, pdfWidth, pdfHeight);
                pdf.save(`${getReportTitle()}.pdf`);
            } catch (e) {
                console.error('导出失败:', e);
                alert('导出失败，请重试');
            }
        }

        // ============ 课程级 AI 识别填充 ============
        function setCourseStatus(ci, text) {
            const card = document.querySelector('.course-editor-card[data-course="' + ci + '"]');
            if (!card) return;
            const el = card.querySelector('[data-role="aiStatus"]');
            if (el) el.innerText = text;
        }

        function addCourseFiles(ci, files) {
            const c = courses[ci];
            if (!c) return;
            c.aiFiles.push(...Array.from(files));
            renderCourseEditor();
            if (c.aiFiles.length) recognizeCourseAI(ci); // 上传后自动识别
        }

        async function recognizeCourseAI(ci) {
            const c = courses[ci];
            if (!c) return;
            if (!c.aiFiles.length) { setCourseStatus(ci, '❌ 请先上传截图或 PDF'); return; }
            if (c.aiBusy) return;
            c.aiBusy = true;
            setCourseStatus(ci, '⏳ AI 识别中...');
            try {
                const prepared = await window.aiClient.prepareFiles(c.aiFiles, { maxImages: 8, maxTextFiles: 6 });
                const result = await window.aiClient.request('/api/ai/final-report-multi/course', {
                    images: prepared.images,
                    textBlocks: prepared.textBlocks,
                    context: {
                        courseName: c.courseName,
                        orderNumber: c.orderNumber,
                        studentName: val('studentName'),
                        university: val('university'),
                        periodStart: val('periodStart'),
                        periodEnd: val('periodEnd')
                    }
                });
                // 只回填三个字段：学习目标回顾 / 学习成果概述 / 讲师寄语
                if (result.learningGoal) c.learningGoal = result.learningGoal;
                if (Array.isArray(result.outcomes) && result.outcomes.length) {
                    c.outcomes = result.outcomes.map(o => ({ subtitle: o.subtitle || '', content: o.content || '' }));
                }
                if (result.teacherMessage) c.teacherMessage = result.teacherMessage;
                c.aiStatus = '';
                c.aiBusy = false;
                renderCourseEditor();
                renderPreview();
                setCourseStatus(ci, '✅ 已填充');
                setTimeout(() => {
                    const card = document.querySelector('.course-editor-card[data-course="' + ci + '"]');
                    const el = card && card.querySelector('[data-role="aiStatus"]');
                    if (el && el.innerText === '✅ 已填充') el.innerText = '';
                }, 2500);
            } catch (err) {
                console.error(err);
                c.aiStatus = '❌ ' + err.message;
                c.aiBusy = false;
                renderCourseEditor();
            }
        }

        // 全局粘贴：定位到最近点击的课程卡
        function setupGlobalPaste() {
            document.addEventListener('paste', (e) => {
                const target = e.target;
                if (target.isContentEditable || target.tagName === 'INPUT' || target.tagName === 'TEXTAREA') return;
                const items = e.clipboardData && e.clipboardData.items;
                if (!items) return;
                const images = [];
                for (let i = 0; i < items.length; i++) {
                    if (items[i].type.indexOf('image') !== -1) {
                        const blob = items[i].getAsFile();
                        if (blob) images.push(new File([blob], 'pasted-' + Date.now() + '-' + i + '.png', { type: blob.type || 'image/png' }));
                    }
                }
                if (images.length) {
                    e.preventDefault();
                    addCourseFiles(lastActiveCourse, images);
                }
            });
        }

        const ASSISTANT_STYLES = [
            '亲切活泼，多用 emoji，像学长学姐一样拉近与学生的距离',
            '温暖鼓励，细腻真诚，着重肯定学生的努力过程',
            '元气满满，热情洋溢，充满感染力和冲劲',
            '专业稳重，言简意赅，偏正式的书面表达',
            '幽默轻松，俏皮有梗，年轻化的网络化表达',
            '知性温柔，娓娓道来，带一点人生思考'
        ];

        async function generateAssistantMessage(regenerate) {
            const statusEl = document.getElementById('assistantStatus');
            if (regenerate) assistantStyleIdx = (assistantStyleIdx + 1) % ASSISTANT_STYLES.length;
            const style = ASSISTANT_STYLES[assistantStyleIdx];
            statusEl.innerText = regenerate
                ? '⏳ 正在更换风格（' + (assistantStyleIdx + 1) + '/' + ASSISTANT_STYLES.length + ')...'
                : '⏳ 生成中...';
            try {
                const result = await window.aiClient.request('/api/ai/final-report-multi/assistant', {
                    context: {
                        studentName: val('studentName'),
                        university: val('university'),
                        attendanceRate: val('attendanceRate'),
                        taskCompletionRate: val('taskCompletionRate'),
                        interactionRate: val('interactionRate'),
                        courses: courses.map(c => ({ courseName: c.courseName, hours: c.hours, totalScore: c.totalScore })),
                        style: style,
                        styleIndex: assistantStyleIdx,
                        previousMessage: regenerate ? lastAssistantMsg : ''
                    }
                });
                const msg = (result && result.assistantMessage) || '';
                if (!msg) throw new Error('AI 未返回寄语内容');
                lastAssistantMsg = msg;
                document.getElementById('assistantMessage').value = msg;
                renderPreview();
                statusEl.innerText = '✅ 已生成（风格' + (assistantStyleIdx + 1) + '，不满意可再点「更换风格」）';
            } catch (err) {
                console.error(err);
                statusEl.innerText = '❌ ' + err.message;
            }
            setTimeout(() => { if (statusEl.innerText.startsWith('✅')) statusEl.innerText = ''; }, 3000);
        }

        // ============ 初始化 ============
        function init() {
            lastAutoOverview = getDefaultOverview();
            document.getElementById('reportOverview').value = lastAutoOverview;
            renderCourseEditor();
            renderSuggestionEditor();
            setupCourseEditorEvents();
            setupGlobalPaste();
            refreshPerformanceDesc();
            renderPreview();

            ['studentName','university','periodStart','periodEnd','attendanceRate','attendanceDesc','taskCompletionRate','taskCompletionDesc','interactionRate','interactionDesc','reportOverview','suggestionsIntro','assistantMessage'].forEach(id => {
                document.getElementById(id).addEventListener('input', () => {
                    if (['attendanceRate','taskCompletionRate','interactionRate'].includes(id)) refreshPerformanceDesc();
                    renderPreview();
                });
            });
            // 辅导类型变化：标题/导出名随之变化；概述若仍是自动生成的（未被手动改过）则同步更新
            document.getElementById('tutorTypeSelect').addEventListener('change', () => {
                const overviewEl = document.getElementById('reportOverview');
                const fresh = getDefaultOverview();
                if (overviewEl.value.trim() === '' || overviewEl.value === lastAutoOverview) {
                    overviewEl.value = fresh;
                    lastAutoOverview = fresh;
                }
                renderPreview();
            });
            document.getElementById('refreshPreviewBtn').addEventListener('click', renderPreview);
            document.getElementById('exportPngBtn').addEventListener('click', exportPng);
            document.getElementById('exportPdfBtn').addEventListener('click', exportPdf);
            document.getElementById('genAssistantBtn').addEventListener('click', () => generateAssistantMessage(false));
            document.getElementById('restyleAssistantBtn').addEventListener('click', () => generateAssistantMessage(true));
        }
        init();
    })();
</script>
</body>
</html>
